openapi: 3.1.0
info:
  title: Loophole API
  version: 0.1.0
  description: Puzzles and background jobs. Errors are RFC 9457 problem details.
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    PuzzleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleSummary"
      required:
        - items
    PuzzleSummary:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        origin:
          $ref: "#/components/schemas/PuzzleOrigin"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - width
        - height
        - origin
        - createdAt
    PuzzleOrigin:
      type: string
      enum:
        - generated
        - submitted
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
          description: Each invalid field, for 400 responses.
      required:
        - type
        - title
        - status
      description: An error, as RFC 9457 problem details.
    Puzzle:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        puzzle:
          $ref: "#/components/schemas/PuzzleWire"
        origin:
          $ref: "#/components/schemas/PuzzleOrigin"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - puzzle
        - origin
        - createdAt
      description: "A published puzzle: clues only, never the solution."
    PuzzleWire:
      type: object
      properties:
        v:
          type: number
          enum:
            - 1
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        clues:
          type: string
          description: "One character per cell, row-major: 0-3 or '.'."
        seed:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
      required:
        - v
        - width
        - height
        - clues
      description: A puzzle in wire format version 1 (docs/FORMAT.md).
    Hint:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - solved
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - mistake
            edge:
              type: integer
              minimum: 0
              description: The first edge marked differently from the solution.
            count:
              type: integer
              minimum: 1
              description: How many marks are wrong.
          required:
            - kind
            - edge
            - count
        - type: object
          properties:
            kind:
              type: string
              enum:
                - step
            rule:
              type: string
              enum:
                - clue-zero
                - clue-satisfied
                - clue-needs-all
                - dot-full
                - dot-continue
                - dot-dead-end
                - corner-1
                - corner-3
                - adjacent-3s
                - diagonal-3s
                - premature-loop
                - loop-complete
                - parity
                - lookahead
            changes:
              type: array
              items:
                type: object
                properties:
                  edge:
                    type: integer
                    minimum: 0
                  state:
                    type: string
                    enum:
                      - line
                      - cross
                required:
                  - edge
                  - state
            cells:
              type: array
              items:
                type: integer
                minimum: 0
            dots:
              type: array
              items:
                type: integer
                minimum: 0
          required:
            - kind
            - rule
            - changes
            - cells
            - dots
        - type: object
          properties:
            kind:
              type: string
              enum:
                - reveal
            edge:
              type: integer
              minimum: 0
              description: An open edge that is a line in the solution.
          required:
            - kind
            - edge
      description: "The next hint: a wrong mark, the next deduction (rule, edges it
        decides, cells and dots it rests on), a line from the solution when no
        rule applies, or solved."
    HintRequest:
      type: object
      properties:
        edges:
          type: string
          maxLength: 20200
          pattern: ^[012]*$
          description: "The player's board: one character per edge, 0 empty, 1 line, 2
            cross (docs/FORMAT.md)."
      required:
        - edges
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum:
            - generate
            - verify
        status:
          type: string
          enum:
