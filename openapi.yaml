            runtime:
              type: string
          required:
            - app
            - generator
            - runtime
        startedAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - database
        - blobs
        - jobs
        - dailies
        - failures
        - versions
        - startedAt
      description: System health for the admin page (PRD §5).
