  /api/submissions:
    post:
      summary: Submit a puzzle for publishing
      description: The server checks that the puzzle has exactly one solution in the
        background (PRD FR-27); poll the returned submission until it is no
        longer pending. Unique puzzles are published at once. Needs a confirmed
        email.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "202":
          description: Accepted. `Location` points at the submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Email not confirmed, or sent from another site (CSRF protection).
          content:
