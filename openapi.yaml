        - kind
        - status
        - progress
        - result
        - error
        - createdAt
        - startedAt
        - finishedAt
    GenerateRequest:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
