        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        startedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
