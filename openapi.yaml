  /api/users/{userId}/attempts/{puzzleId}/finish:
    post:
      summary: Finish a ranked attempt with the solved board
      description: "The server checks the board against the stored solution (PRD
        FR-17, FR-25) and sets the ranked time: the player's own time, but never
        more than a tenth of the server's time (3 to 15 s) under it. A solve is
        ranked unless a hint was used or it was faster than the loop can be
        drawn. Sending it again returns the finished attempt unchanged."
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            description: Must be the logged-in user's id; anything else is refused with 403.
          required: true
