          in: path
      responses:
        "200":
          description: The saved board, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResult"
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
