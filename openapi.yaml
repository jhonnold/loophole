      required:
        - width
        - height
      additionalProperties: false
  parameters: {}
paths:
  /api/health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/puzzles:
    get:
      summary: Recent published puzzles, newest first
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Puzzles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleList"
        "400":
          description: Invalid query.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/puzzles/{id}:
    get:
      summary: A published puzzle's clues (never its solution)
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The puzzle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Puzzle"
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/puzzles/{id}/hint:
    post:
      summary: The next hint for a player's board
      description: Works from the player's marks and the stored solution, which is
        never sent (PRD FR-12, FR-25).
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HintRequest"
      responses:
        "200":
          description: The hint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hint"
        "400":
          description: Invalid id, or a board that does not fit the puzzle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request body larger than 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Request body is not JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/jobs/generate:
    post:
      summary: Queue a puzzle generation
      description: Generation runs in the background; poll the returned job until it
        is done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Queued. `Location` points at the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request body larger than 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Request body is not JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Too many jobs waiting; try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/jobs/{id}:
    get:
      summary: A job's status, progress and result
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
