        "403":
          description: The path names another user, or the request came from another site
            (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests; `Retry-After` says when to try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      summary: Save the logged-in user's board on a puzzle
      description: A solved record is kept until it is deleted. Sending the board
        already stored only updates the play time and keeps the version. A
        solved board replaces an unsolved one. Otherwise the board is saved only
        if it continues from the stored `version` (`baseVersion`) or comes from
        the `device` that saved it, so a stale tab can't overwrite newer play
        from another device. `assisted` only ever turns on. Whether the board is
        solved is worked out by the server.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            description: Must be the logged-in user's id; anything else is refused with 403.
          required: true
          description: Must be the logged-in user's id; anything else is refused with 403.
          name: userId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 64
          required: true
          name: puzzleId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressRequest"
      responses:
        "200":
          description: What is saved now, and whether it is the board sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveProgressResult"
        "400":
          description: Invalid body, or a board that does not fit the puzzle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The path names another user, or the request came from another site
            (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request body larger than 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Request body is not JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests; `Retry-After` says when to try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      summary: Forget the logged-in user's board on a puzzle (start over)
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            description: Must be the logged-in user's id; anything else is refused with 403.
          required: true
          description: Must be the logged-in user's id; anything else is refused with 403.
          name: userId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 64
          required: true
          name: puzzleId
          in: path
      responses:
        "204":
          description: Deleted (also when nothing was saved).
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The path names another user, or the request came from another site
