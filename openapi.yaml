# Generated by `bun run gen:api` from apps/server/src/api. Do not edit.
openapi: 3.1.0
info:
  title: Loophole API
  version: 0.1.0
  description: Puzzles, background jobs, accounts, saved progress, submitted
    puzzles and reports. Errors are RFC 9457 problem details. State-changing
    requests from other sites are refused (403).
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-loophole_session
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    PuzzleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleSummary"
      required:
        - items
    PuzzleSummary:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        origin:
          $ref: "#/components/schemas/PuzzleOrigin"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - width
        - height
        - origin
        - createdAt
    PuzzleOrigin:
      type: string
      enum:
        - generated
        - submitted
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
          description: Each invalid field, for 400 responses.
      required:
        - type
        - title
        - status
      description: An error, as RFC 9457 problem details.
    Puzzle:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        puzzle:
          $ref: "#/components/schemas/PuzzleWire"
        origin:
          $ref: "#/components/schemas/PuzzleOrigin"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - puzzle
        - origin
        - createdAt
      description: "A published puzzle: clues only, never the solution."
    PuzzleWire:
      type: object
      properties:
        v:
          type: number
          enum:
            - 1
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        clues:
          type: string
          description: "One character per cell, row-major: 0-3 or '.'."
        seed:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
      required:
        - v
        - width
        - height
        - clues
      description: A puzzle in wire format version 1 (docs/FORMAT.md).
    Hint:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - solved
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - mistake
            edge:
              type: integer
              minimum: 0
              description: The first edge marked differently from the solution.
            count:
              type: integer
              minimum: 1
              description: How many marks are wrong.
          required:
            - kind
            - edge
            - count
        - type: object
          properties:
            kind:
              type: string
              enum:
                - step
            rule:
              type: string
              enum:
                - clue-zero
                - clue-satisfied
                - clue-needs-all
                - dot-full
                - dot-continue
                - dot-dead-end
                - corner-1
                - corner-3
                - adjacent-3s
                - diagonal-3s
                - premature-loop
                - loop-complete
                - parity
                - lookahead
            changes:
              type: array
              items:
                type: object
                properties:
                  edge:
                    type: integer
                    minimum: 0
                  state:
                    type: string
                    enum:
                      - line
                      - cross
                required:
                  - edge
                  - state
            cells:
              type: array
              items:
                type: integer
                minimum: 0
            dots:
              type: array
              items:
                type: integer
                minimum: 0
          required:
            - kind
            - rule
            - changes
            - cells
            - dots
        - type: object
          properties:
            kind:
              type: string
              enum:
                - reveal
            edge:
              type: integer
              minimum: 0
              description: An open edge that is a line in the solution.
          required:
            - kind
            - edge
      description: "The next hint: a wrong mark, the next deduction (rule, edges it
        decides, cells and dots it rests on), a line from the solution when no
        rule applies, or solved."
    HintRequest:
      type: object
      properties:
        edges:
          type: string
          maxLength: 20200
          pattern: ^[012]*$
          description: "The player's board: one character per edge, 0 empty, 1 line, 2
            cross (docs/FORMAT.md)."
      required:
        - edges
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum:
            - generate
            - verify
        status:
          type: string
          enum:
            - queued
            - running
            - done
            - failed
            - timeout
        progress:
          type: number
          minimum: 0
          maximum: 1
        result:
          type:
            - object
            - "null"
          properties:
            puzzleId:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - puzzleId
          description: Set when a generation is done.
        error:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        startedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - kind
        - status
        - progress
        - result
        - error
        - createdAt
        - startedAt
        - finishedAt
    GenerateRequest:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        seed:
          type: string
          minLength: 1
          maxLength: 128
          description: Same seed, size and generator version give the same puzzle.
      required:
        - width
        - height
      additionalProperties: false
    AuthConfig:
      type: object
      properties:
        turnstileSiteKey:
          type: string
          description: Site key for the sign-up CAPTCHA.
      required:
        - turnstileSiteKey
    Session:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required:
        - user
      description: "`user` is null when no one is logged in."
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - emailVerified
        - isAdmin
        - createdAt
      description: The logged-in player. Only the email is personal data.
    SignUpRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          example: player@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8 to 128 characters.
        captchaToken:
          type: string
          minLength: 1
          maxLength: 2048
          description: The token from the Turnstile widget.
      required:
        - email
        - password
        - captchaToken
      additionalProperties: false
    LogInRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          example: player@example.com
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The token from the link in the email (after `#token=`).
      required:
        - token
      additionalProperties: false
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          example: player@example.com
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The token from the link in the email (after `#token=`).
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8 to 128 characters.
      required:
        - token
        - password
      additionalProperties: false
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - password
      additionalProperties: false
    ProgressList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgressSummary"
      required:
        - items
    ProgressSummary:
      type: object
      properties:
        puzzleId:
          type: string
          minLength: 1
          maxLength: 64
        width:
          type: integer
        height:
          type: integer
        elapsedMs:
          type: integer
          minimum: 0
          maximum: 8640000000
          description: Play time on this attempt in milliseconds.
        assisted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - puzzleId
        - width
        - height
        - elapsedMs
        - assisted
        - updatedAt
    ProgressResult:
      type: object
      properties:
        progress:
          anyOf:
            - $ref: "#/components/schemas/Progress"
            - type: "null"
      required:
        - progress
      description: "`progress` is null when nothing is saved."
    Progress:
      type: object
      properties:
        puzzleId:
          type: string
          minLength: 1
          maxLength: 64
        edges:
          type: string
          description: Edge states (docs/FORMAT.md).
        elapsedMs:
          type: integer
          minimum: 0
          maximum: 8640000000
          description: Play time on this attempt in milliseconds.
        solved:
          type: boolean
        assisted:
          type: boolean
          description: A hint was shown during this attempt.
        version:
          type: integer
          minimum: 1
          description: Goes up with every save that replaces the board; send it back as
            `baseVersion`.
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - puzzleId
        - edges
        - elapsedMs
        - solved
        - assisted
        - version
        - updatedAt
      description: A saved board on one puzzle (PRD FR-21).
    SaveProgressResult:
      type: object
      properties:
        progress:
          $ref: "#/components/schemas/Progress"
        accepted:
          type: boolean
          description: "False when the saved record was kept instead: it is solved, or the
            save was stale. `progress` is then that record."
      required:
        - progress
        - accepted
    SaveProgressRequest:
      type: object
      properties:
        edges:
          type: string
          maxLength: 20200
          pattern: ^[012]*$
          description: "The player's board: one character per edge, 0 empty, 1 line, 2
            cross (docs/FORMAT.md)."
        elapsedMs:
          type: integer
          minimum: 0
          maximum: 8640000000
          description: Play time on this attempt in milliseconds.
        assisted:
          type: boolean
        baseVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: The `version` this board continues from, or null when the client
            had none.
        device:
          type: string
          minLength: 1
          maxLength: 64
          description: A random id for this browser, the same on every save.
      required:
        - edges
        - elapsedMs
        - assisted
        - baseVersion
        - device
      additionalProperties: false
    Submission:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        status:
          type: string
          enum:
            - pending
            - published
            - rejected
        verdict:
          type:
            - string
            - "null"
          enum:
            - unique
            - duplicate
            - none
            - multiple
            - unknown
            - removed
            - error
            - null
          description: "Null while pending. `unique`: published. `duplicate`: the same
            clues were already published, see `puzzleId`. `none`, `multiple`: no
            solution, or more than one. `unknown`: the verifier ran out of time.
            `removed`: the same clues were unpublished by an admin. `error`: the
            check failed."
        puzzleId:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
          description: The published puzzle to play and share.
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-25T12:00:00.000Z
      required:
        - id
        - width
        - height
        - status
        - verdict
        - puzzleId
        - createdAt
        - decidedAt
      description: A submitted puzzle and the verifier's verdict.
    SubmitRequest:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        clues:
          type: string
          maxLength: 10000
          pattern: ^[0-3.]*$
          description: "One character per cell, row-major: 0-3 or '.' (docs/FORMAT.md)."
      required:
        - width
        - height
        - clues
      additionalProperties: false
      description: "A puzzle to publish: its size and clues."
    SubmissionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
      required:
        - items
    ReportRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: What is wrong with the puzzle, 1 to 500 characters.
      required:
        - reason
      additionalProperties: false
    ReportedPuzzleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportedPuzzle"
      required:
        - items
    ReportedPuzzle:
      type: object
      properties:
        puzzleId:
          type: string
          minLength: 1
          maxLength: 64
        width:
          type: integer
          minimum: 1
          maximum: 100
        height:
          type: integer
          minimum: 1
          maximum: 100
        origin:
          type: string
          enum:
            - generated
            - submitted
        createdAt:
          type: string
          format: date-time
          example: 2026-10-25T12:00:00.000Z
        count:
          type: integer
          minimum: 1
          description: How many players reported it.
        reports:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
              createdAt:
                type: string
                format: date-time
                example: 2026-10-25T12:00:00.000Z
            required:
              - reason
              - createdAt
          description: The newest reports first, at most five.
      required:
        - puzzleId
        - width
        - height
        - origin
        - createdAt
        - count
        - reports
  parameters: {}
paths:
  /api/health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/puzzles:
    get:
      summary: Recent published puzzles, newest first
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Puzzles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleList"
        "400":
          description: Invalid query.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/puzzles/{id}:
    get:
      summary: A published puzzle's clues (never its solution)
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The puzzle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Puzzle"
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id (admins also get unpublished ones).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/puzzles/{id}/hint:
    post:
      summary: The next hint for a player's board
      description: Works from the player's marks and the stored solution, which is
        never sent (PRD FR-12, FR-25).
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HintRequest"
      responses:
        "200":
          description: The hint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hint"
        "400":
          description: Invalid id, or a board that does not fit the puzzle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No published puzzle with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request body larger than 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Request body is not JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/jobs/generate:
    post:
      summary: Queue a puzzle generation
      description: Generation runs in the background; poll the returned job until it
        is done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Queued. `Location` points at the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request body larger than 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Request body is not JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Too many jobs waiting; try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/jobs/{id}:
    get:
      summary: A job's status, progress and result
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 0b8e9f5c-6f7e-4c43-9d55-0d5f8e7b3a21
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/auth/config:
    get:
      summary: Settings the sign-up form needs
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /api/session:
    get:
      summary: Who is logged in
      responses:
        "200":
          description: The logged-in user, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /api/auth/signup:
    post:
      summary: Create an account
      description: Mails a verification link. The answer is the same whether or not
        the email already has an account; such an account gets a note instead.
        Does not log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "204":
          description: Accepted; check your email.
        "400":
          description: Invalid body, or the CAPTCHA check failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts; `Retry-After` says when to try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/auth/login:
    post:
      summary: Log in
      description: Sets a new session cookie and ends the session of the cookie sent,
        if any.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Wrong email or password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts; `Retry-After` says when to try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/auth/logout:
    post:
      summary: Log out
      responses:
        "204":
          description: Logged out (also when no one was).
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/auth/verify-email:
    post:
      summary: Confirm an email address with the mailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Verified.
        "400":
          description: Invalid body, or the link is invalid, used or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Sent from another site (CSRF protection).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts; `Retry-After` says when to try again.
