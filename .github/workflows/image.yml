name: Image

# Builds the production image (Dockerfile) on every push to main and publishes it to GitHub's
# container registry as ghcr.io/jhonnold/loophole:<short sha> and :main. A deployment pins the
# sha tag; README, "Production", has the rest.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          tags: |
            ghcr.io/jhonnold/loophole:${{ steps.version.outputs.sha }}
            ghcr.io/jhonnold/loophole:main
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
