<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loophole small phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1C19;text-decoration:none}a:hover{color:#2E4C8A}
</style>
</helmet>
<div style="width: 360px; height: 560px; box-sizing: border-box; overflow: hidden; overscroll-behavior: none; background: #F4EFE3; color: #1E1C19; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; padding: 8px 14px; display: flex; flex-direction: column; gap: 8px">
  <header style="height: 48px; flex: 0 0 auto; display: flex; align-items: center; gap: 6px">
    <a href="Home.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 1.2; min-width: 0">
      <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 18px">Small · 7×7</span>
      <span style="font-size: 12px; color: #5B554B; font-weight: 500"><b style="color: #1E1C19">{{b.analysis.satisfied}}</b> of {{b.analysis.clueCount}} clues</span>
    </div>
    <div style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 5px 0 12px; box-sizing: border-box; border-radius: 999px; background: #FFFDF8; border: 2px solid #1E1C19; flex: 0 0 auto">
      <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">04:12</span>
      <button type="button" aria-label="Pause" style="width: 32px; height: 32px; border-radius: 50%; border: 0; background: #1E1C19; color: #FFFDF8; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2v10M10 2v10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div style="flex: 0 0 auto; position: relative; background: #FFFDF8; border: 2px solid #1E1C19; width: 328px; height: 328px; touch-action: none">
    <sc-for list="{{b.lines}}" as="l"><div style="{{l.style}}"></div></sc-for>
    <sc-for list="{{b.xs}}" as="x"><div style="{{x.style}}">×</div></sc-for>
    <sc-for list="{{b.dots}}" as="d"><div style="{{d.style}}"></div></sc-for>
    <sc-for list="{{b.clues}}" as="q"><div style="{{q.style}}">{{q.txt}}</div></sc-for>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5B554B">Tap an edge: <b style="color: #1E1C19">line</b>, <b style="color: #1E1C19">×</b>, empty.</p>
    <nav aria-label="Puzzle tools" style="margin-top: auto; height: 64px; box-sizing: border-box; background: #FFFDF8; border: 2px solid #1E1C19; border-radius: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 3px">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #1E1C19">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo
      </button>
      <button type="button" disabled style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #A69E90">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>Redo
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #2E4C8A">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>Hint
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #1E1C19">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Clear
      </button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":560}}'>
function lpParse(W, H, clues) {
  return { W: W, H: H, clue: clues.split('').map(function (ch) { return ch === '.' ? null : +ch; }) };
}
function lpCellEdges(p, r, c) {
  var W = p.W;
  return [['h', r * W + c], ['h', (r + 1) * W + c], ['v', r * (W + 1) + c], ['v', r * (W + 1) + c + 1]];
}
function lpEdgeDots(p, t, i) {
  var W = p.W;
  if (t === 'h') { var r = Math.floor(i / W), c = i % W; return [[r, c], [r, c + 1]]; }
  var rv = Math.floor(i / (W + 1)), cv = i % (W + 1); return [[rv, cv], [rv + 1, cv]];
}
function lpLayout(p, s, o) {
  var W = p.W, H = p.H, S = o.S, M = o.M, t = o.t, r, c;
  var a = { satisfied: 0, clueCount: 0 };
  var out = { dots: [], clues: [], lines: [], xs: [], analysis: a };
  var px = function (n) { return Math.round(n * 10) / 10 + 'px'; };
  for (r = 0; r < H; r++) for (c = 0; c < W; c++) {
    var i = r * W + c, k = p.clue[i];
    var x = M + c * S, y = M + r * S;
    if (k === null) continue;
    a.clueCount++;
    var lines = lpCellEdges(p, r, c).filter(function (e) { return s[e[0]][e[1]] === 1; }).length;
    if (lines === k) a.satisfied++;
    out.clues.push({ txt: String(k), style: 'position:absolute;left:' + px(x) + ';top:' + px(y) + ';width:' + px(S) + ';height:' + px(S) + ';display:flex;align-items:center;justify-content:center;font-size:' + px(S * 0.56) + ';font-weight:500;line-height:1;color:' + o.c.ink });
  }
  var dotSize = Math.max(4, Math.round(S * 0.11));
  for (r = 0; r <= H; r++) for (c = 0; c <= W; c++) {
    var dx = M + c * S, dy = M + r * S;
    out.dots.push({ style: 'position:absolute;left:' + px(dx - dotSize / 2) + ';top:' + px(dy - dotSize / 2) + ';width:' + px(dotSize) + ';height:' + px(dotSize) + ';border-radius:50%;background:' + o.c.dot });
  }
  ['h', 'v'].forEach(function (tt) {
    s[tt].forEach(function (val, i) {
      if (!val) return;
      var d = lpEdgeDots(p, tt, i), x0 = M + d[0][1] * S, y0 = M + d[0][0] * S;
      var mx = tt === 'h' ? x0 + S / 2 : x0, my = tt === 'h' ? y0 : y0 + S / 2;
      if (val === 1) {
        var base = tt === 'h'
          ? 'left:' + px(x0 - t / 2) + ';top:' + px(y0 - t / 2) + ';width:' + px(S + t) + ';height:' + px(t)
          : 'left:' + px(x0 - t / 2) + ';top:' + px(y0 - t / 2) + ';width:' + px(t) + ';height:' + px(S + t);
        out.lines.push({ style: 'position:absolute;' + base + ';border-radius:' + px(t / 2) + ';background:' + o.c.line });
      } else {
        out.xs.push({ style: 'position:absolute;left:' + px(mx - S * 0.2) + ';top:' + px(my - S * 0.2) + ';width:' + px(S * 0.4) + ';height:' + px(S * 0.4) + ';display:flex;align-items:center;justify-content:center;font-size:' + px(S * 0.36) + ';line-height:1;color:' + o.c.x });
      }
    });
  });
  return out;
}

class Component extends DCLogic {
  renderVals() {
    var p = lpParse(7, 7, '.11..0..23.2......2.21.0....1....01.1..3..0..1..1');
    var s = {
      h: '22212221122020121200022220000020020000002020000002200000'.split('').map(Number),
      v: '22211222121100000022000000220000000002202000000022000000'.split('').map(Number)
    };
    // 44px cells: the smallest size that keeps FR-13's 44px touch target at 360px wide.
    var b = lpLayout(p, s, { S: 44, M: 10, t: 4.5, c: { ink: '#1E1C19', dot: '#1E1C19', line: '#1E1C19', x: '#8C8476' } });
    return { b: b };
  }
}
</script>
</body>
</html>
